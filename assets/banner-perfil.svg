<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" role="img" aria-labelledby="titulo-banner subtitulo-banner">
  <title id="titulo-banner">Gabriel Chaves do Carmo Cavalcante — Engenharia de Software Full-Stack e Análise de Dados</title>
  <desc id="subtitulo-banner">TypeScript, Node.js, Python, Django, React, PostgreSQL, MySQL e Docker. Rio de Janeiro, RJ. Inglês Fluente C2.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14" />
      <stop offset="60%" stop-color="#111822" />
      <stop offset="100%" stop-color="#0d1b18" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Fundo principal -->
  <rect width="960" height="220" rx="12" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="960" height="220" rx="12" fill="url(#grid)" />

  <!-- Barra superior de acento -->
  <rect x="1" y="1" width="958" height="4" rx="2" fill="url(#accentLine)" />

  <!-- Tag superior -->
  <g transform="translate(44, 34)">
    <rect x="0" y="0" width="356" height="26" rx="6" fill="#0f2922" stroke="#10b981" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" fill="#6ee7b7" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6">
      ENGENHARIA DE SOFTWARE &amp; ANÁLISE DE DADOS
    </text>
  </g>

  <!-- Nome -->
  <text x="44" y="102" fill="#f8fafc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.4">
    Gabriel Chaves do Carmo Cavalcante
  </text>

  <!-- Subtítulo -->
  <text x="44" y="132" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
    Desenvolvedor Full-Stack Júnior &amp; Analista de Dados Júnior · <tspan fill="#e2e8f0" font-weight="600">IFES (TADS)</tspan> · <tspan fill="#e2e8f0" font-weight="600">Ex-Residente em TIC (Softex/MCTI)</tspan>
  </text>

  <!-- Pílulas de destaque técnico -->
  <g transform="translate(44, 158)" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="102" height="28" rx="6" fill="#172033" stroke="#334155" />
    <text x="51" y="18" fill="#60a5fa" text-anchor="middle">TypeScript</text>

    <rect x="112" y="0" width="84" height="28" rx="6" fill="#172033" stroke="#334155" />
    <text x="154" y="18" fill="#34d399" text-anchor="middle">Node.js</text>

    <rect x="206" y="0" width="136" height="28" rx="6" fill="#172033" stroke="#334155" />
    <text x="274" y="18" fill="#fbbf24" text-anchor="middle">Python · Django</text>

    <rect x="352" y="0" width="76" height="28" rx="6" fill="#172033" stroke="#334155" />
    <text x="390" y="18" fill="#38bdf8" text-anchor="middle">React</text>

    <rect x="438" y="0" width="154" height="28" rx="6" fill="#172033" stroke="#334155" />
    <text x="515" y="18" fill="#a78bfa" text-anchor="middle">SQL · PostgreSQL</text>

    <rect x="602" y="0" width="78" height="28" rx="6" fill="#172033" stroke="#334155" />
    <text x="641" y="18" fill="#38bdf8" text-anchor="middle">Docker</text>

    <rect x="690" y="0" width="108" height="28" rx="6" fill="#0f2922" stroke="#10b981" stroke-opacity="0.5" />
    <text x="744" y="18" fill="#6ee7b7" text-anchor="middle">Inglês C2</text>

    <rect x="808" y="0" width="108" height="28" rx="6" fill="#172033" stroke="#334155" />
    <text x="862" y="18" fill="#cbd5e1" text-anchor="middle">RJ · Remoto</text>
  </g>
</svg>
